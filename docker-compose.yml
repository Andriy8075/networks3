name: lab3-monitoring

networks:
  monitoring:
    name: monitoring
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
  frontend:
    external: true
    name: frontend

volumes:
  zabbix-db:
  grafana-data:

services:
  zabbix-db:
    image: postgres:16.15-alpine
    container_name: zabbix-db
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
      TZ: Europe/Kyiv
    volumes:
      - zabbix-db:/var/lib/postgresql/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0.30
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
      TZ: Europe/Kyiv
    depends_on:
      zabbix-db:
        condition: service_healthy
    networks:
      - monitoring
      - frontend
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0.30
    container_name: zabbix-web
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zabbix
      PHP_TZ: Europe/Kyiv
      TZ: Europe/Kyiv
    ports:
      - "8081:8080"
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks:
      - monitoring
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0.30
    container_name: zabbix-agent
    pid: host
    group_add:
      - "0"
    environment:
      ZBX_HOSTNAME: docker-host
      ZBX_SERVER_HOST: zabbix-server
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "false"
      TZ: Europe/Kyiv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    restart: unless-stopped

  net-device:
    build: ./snmp
    image: lab3-snmpd:3.22
    container_name: net-device
    environment:
      SNMP_COMMUNITY: ${SNMP_COMMUNITY}
      TZ: Europe/Kyiv
    command: ["snmpd"]
    networks:
      - monitoring
    restart: unless-stopped

  snmp-tools:
    build: ./snmp
    image: lab3-snmpd:3.22
    container_name: snmp-tools
    environment:
      SNMP_COMMUNITY: ${SNMP_COMMUNITY}
      TZ: Europe/Kyiv
    command: ["sleep", "infinity"]
    depends_on:
      net-device:
        condition: service_started
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app 6.9.1
      TZ: Europe/Kyiv
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
    networks:
      - monitoring
    restart: unless-stopped

  bootstrap:
    build: ./bootstrap
    image: lab3-bootstrap:1
    environment:
      ZABBIX_API_URL: http://zabbix-web:8080/api_jsonrpc.php
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_ZABBIX_PASSWORD: ${GRAFANA_ZABBIX_PASSWORD}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY}
      TEMPLATE_DIR: /templates
      DASHBOARD_DIR: /dashboards
      STATE_DIR: /state
      TZ: Europe/Kyiv
    volumes:
      - ./templates:/templates
      - ./grafana/dashboards:/dashboards
      - ./bootstrap/state:/state
    depends_on:
      zabbix-web:
        condition: service_started
      zabbix-server:
        condition: service_started
      grafana:
        condition: service_started
      zabbix-agent:
        condition: service_started
      net-device:
        condition: service_started
    networks:
      - monitoring
    restart: "no"
